name: Shell contracts

on:
  push:
  pull_request:

jobs:
  shell-contracts:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RokiLai/ai-instructions
          path: source/ai-instructions
      - name: Verify source Shell contracts
        env:
          AI_INSTRUCTIONS_SOURCE_PROJECT: ${{ github.workspace }}/source/ai-instructions
        run: sh scripts/verify-shell-contracts.sh
