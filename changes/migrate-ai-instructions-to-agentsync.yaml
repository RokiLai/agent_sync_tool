task: migrate-ai-instructions-to-agentsync
summary: 全面将 ai-instructions 迁移并重构为 agentsync，支持平滑数据自动迁移与向后兼容
allowed_paths:
  - changes/migrate-ai-instructions-to-agentsync.yaml
  - cmd/**
  - internal/**
  - test/**
  - docs/**
  - README.md
  - VERSION
  - install.sh
  - Makefile
  - scripts/**
constraints:
  - 默认配置目录升级为 ~/.config/agentsync，Runtime 目录升级为 ~/.local/share/agentsync-runtime
  - 优先读取 AGENTSYNC_* 环境变量，向后兼容 fallback 至 AI_INSTRUCTIONS_*
  - 写入使用全新的 agentsync Managed Markers，读取和清理时兼容新旧两套 Marker
  - 自动检测并平滑迁移存量 ~/.config/ai-instructions 数据
  - 历史命令列表保留 aic 和 ai-instructions 用于存量环境清理
  - 版本输出统一为 agentsync <version>
  - 不引入第三方外部依赖
verification:
  - 新旧 Marker 兼容读取与自动迁移单元测试及集成测试
  - 环境变量优先级覆盖测试
  - Shell 集成注入新旧 Block 替换清理测试
  - make verify 质量门禁全量通过（vet, race, cross-build）
