task: release-v3.3.1
summary: 发布 v3.3.1 版本（Spinner 动态旋转加载指示器）
allowed_paths:
  - changes/release-v3.3.1.yaml
  - changes/terminal-spinner-loading.yaml
  - internal/terminalprogress/progress.go
  - internal/terminalprogress/progress_test.go
  - internal/app/app.go
  - internal/app/app_test.go
  - scripts/build-release.sh
  - test/integration/quality_gate_test.go
  - test/integration/readonly_test.go
  - test/integration/upgrade_test.go
constraints:
  - 版本号统一为 3.3.1，Git 标签统一为 v3.3.1
